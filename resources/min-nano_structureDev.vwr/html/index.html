<!DOCTYPE html>
<!--
	実機フィードバックの往復パレット（M24）。src/Extensions/ExtFeedbackPalette.h の中身。

	C++ 側が `homeskz.tick` / `stop` / `checkNow` / `hide` を Promise で公開する。ここは
	数秒ごとに tick を呼んで見え方（JSON）を描き直すだけで、往復の判断は 1 つも持たない
	（駆動は src/FeedbackLoop.cpp）。GitHub を見に行く間隔は C++ 側が決めるので、ここの
	タイマーは細かくてよい（間隔に満たない tick は何もせず現在の見え方が返る）。

	外部のスクリプトもスタイルも読まない（埋め込みブラウザはオフラインで動く）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>実機フィードバックの往復</title>
<style>
	body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size: 12px;
		   margin: 10px 12px; color: #222; background: #f6f6f6; }
	.phase { font-weight: bold; margin-bottom: 4px; }
	.phase.waiting { color: #1a6f2b; }
	.phase.working { color: #9a5b00; }
	.phase.stopped { color: #8a1c1c; }
	.phase.idle { color: #555; }
	.message { line-height: 1.5; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
	.facts { color: #555; margin-bottom: 8px; line-height: 1.5; }
	.facts code { font-family: Menlo, Consolas, monospace; }
	.buttons button { margin-right: 6px; font-size: 12px; padding: 3px 10px; }
	.note { color: #777; margin-top: 8px; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
	<div id="phase" class="phase idle">接続しています…</div>
	<div id="message" class="message">プラグインからの応答を待っています。</div>
	<div id="facts" class="facts"></div>
	<div class="buttons">
		<button id="checkNow" type="button" disabled>今すぐ確認</button>
		<button id="stop" type="button" disabled>往復を止める</button>
		<button id="hide" type="button">閉じる</button>
	</div>
	<div class="note">Claude が PR に <code>control=stop</code> の合図を付けるか、ここで止めるまで、
		新しいビルドが出るたびに同じ条件で取り込んで結果を PR へ投稿します。
		次の周が始まる前に、前の周の図を「取り消し」で戻しておくと絵が二重になりません。</div>

<script>
(function () {
	var TICK_MS = 5000;
	var phaseEl = document.getElementById('phase');
	var messageEl = document.getElementById('message');
	var factsEl = document.getElementById('facts');
	var checkNowBtn = document.getElementById('checkNow');
	var stopBtn = document.getElementById('stop');
	var hideBtn = document.getElementById('hide');
	var busy = false;

	var PHASE_LABEL = {
		idle: '往復は回っていません',
		waiting: '往復中（新しいビルドを待っています）',
		working: '入れ替え・取り込みの最中です',
		stopped: '往復を終えました'
	};

	function bridge() {
		return (typeof window.homeskz !== 'undefined' && typeof window.homeskz.tick === 'function')
			? window.homeskz : null;
	}

	function seconds(n) {
		if (n < 0) { return ''; }
		if (n < 60) { return n + ' 秒'; }
		return Math.floor(n / 60) + ' 分 ' + (n % 60) + ' 秒';
	}

	function render(view) {
		if (typeof view === 'string') {
			try { view = JSON.parse(view); } catch (e) { view = { phase: 'idle', message: String(view) }; }
		}
		var phase = view.phase || 'idle';
		phaseEl.className = 'phase ' + phase;
		phaseEl.textContent = PHASE_LABEL[phase] || phase;
		messageEl.textContent = view.message || '';

		var facts = [];
		if (view.repo && view.pr) { facts.push('PR: ' + view.repo + '#' + view.pr); }
		if (view.branch) { facts.push('ブランチ: ' + view.branch); }
		if (view.round) { facts.push('round ' + view.round + (view.build ? '（' + view.build + '）' : '')); }
		if (phase === 'waiting') {
			if (view.secondsUntilNext >= 0) { facts.push('次の確認まで ' + seconds(view.secondsUntilNext)); }
			else if (view.secondsSinceCheck >= 0) { facts.push('最後の確認: ' + seconds(view.secondsSinceCheck) + ' 前'); }
		}
		factsEl.textContent = facts.join(' ／ ');

		var active = (phase === 'waiting' || phase === 'working');
		stopBtn.disabled = !active || busy;
		checkNowBtn.disabled = phase !== 'waiting' || busy;
	}

	function call(name) {
		var b = bridge();
		if (!b) {
			phaseEl.className = 'phase idle';
			phaseEl.textContent = '接続しています…';
			messageEl.textContent = 'プラグインの関数（homeskz.' + name + '）がまだ見えません。';
			return;
		}
		if (busy) { return; }
		busy = true;
		var p;
		try { p = b[name](); } catch (e) { busy = false; messageEl.textContent = '呼び出しに失敗: ' + e; return; }
		Promise.resolve(p).then(function (view) {
			busy = false;
			render(view);
		}).catch(function (err) {
			busy = false;
			messageEl.textContent = '応答がありません: ' + err;
		});
	}

	checkNowBtn.addEventListener('click', function () { call('checkNow'); });
	stopBtn.addEventListener('click', function () {
		if (window.confirm('自動の往復を止めます。記憶は残るので、取り込みをもう一度実行すれば続きから走ります。')) {
			call('stop');
		}
	});
	hideBtn.addEventListener('click', function () { call('hide'); });

	call('tick');
	window.setInterval(function () { call('tick'); }, TICK_MS);
})();
</script>
</body>
</html>
