name: Build plug-in

on:
  # Only main builds on push — it is the protected default branch. Feature work
  # always lives in a pull request, which is what builds those branches (and
  # publishes their dev prerelease). This keeps a branch-with-an-open-PR from
  # building twice (once for the push, once for the PR).
  push:
    branches: [main]
  pull_request:
  # このワークフローだけは workflow_dispatch を残す。stable リリースの取りこぼしを
  # 検知した stable-release-healthcheck.yml が `gh workflow run build.yml --ref main`
  # で再ディスパッチして stable を再公開するため、リリース経路に必要な入口である
  # （lint / test / codeql の手動ディスパッチは誰も使っておらず、単なる「再実行」なら
  # Actions 画面の Re-run で足りるので削除した）。手で調査を回したいときは
  # ci-debug.yml を使う。
  workflow_dispatch:

# Least privilege by default: the build jobs only check out the code and upload
# artifacts, so they get read-only access. The one job that needs to write
# (publishing the GitHub Release) requests contents: write on itself instead.
#
# この分離が、ビルドジョブが PR の head を checkout してその中のスクリプトを走らせても
# 安全である根拠になっている（fork の PR では release ジョブの publish ステップが
# 条件で外れるので、fork のコードで作った成果物は決して公開されない）。CodeQL の
# actions/untrusted-checkout/medium はこの経路を指すが、上記の理由で除外して
# ある——判断の全文と「見直しが要る条件」は .github/codeql/codeql-config.yml に
# 書いてあるので、ここの permissions や release ジョブの条件を緩めるときは
# 必ずそちらも読むこと。
permissions:
  contents: read

# One build per ref. On a pull request a new push cancels the in-flight build
# for that PR: only the latest commit's dev prerelease matters, so racing an
# outdated build to completion just wastes runner time. The delete+recreate of
# the "dev-<branch>" prerelease is per-branch and idempotent, so a cancel mid-
# publish is harmless — the newer run that triggered the cancellation republishes
# the prerelease for its (newer) commit, and state converges to the latest push.
#
# On main we deliberately do NOT cancel (cancel-in-progress is false for push /
# workflow_dispatch): every commit to main publishes its own stable release, so
# each build must run to completion and none may be superseded. The group is
# per-ref (refs/pull/<n>/merge is unique per PR, refs/heads/main for main), so
# one branch's build never cancels another's.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mac:
    # Apple Silicon runner (macos-14 and macos-15 are arm64).
    runs-on: macos-15

    env:
      # URL of the Vectorworks 2026 mac SDK (a ~140 MB zip, ~790 MB unpacked).
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-mac-SDK.zip
      # Where the trimmed SDK lives after the first download. This directory is
      # what gets cached, so we never download the zip more than once.
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk
      # Bump the "v" suffix to force a fresh SDK download (e.g. after Vectorworks
      # publishes a new "latest" SDK).
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-mac-v3
      # ccache speeds up repeat builds: unchanged translation units are served
      # from the object cache instead of recompiled (the SDK-heavy TUs behind the
      # PCH dominate the build). The dir is cached across runs. pch_defines +
      # time_macros let ccache cache PCH-using compilations correctly.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      # Resolve the commit/ref we are really building. For a pull_request event
      # GITHUB_SHA is an ephemeral merge commit and GITHUB_REF_NAME is
      # "<n>/merge", so use the PR head instead — that is the commit the
      # developer pushed and the one the dev prerelease should point at.
      - name: Resolve build context
        id: ctx
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
            # A pull request publishes the dev prerelease, so build ONLY the dev
            # channel — the stable bundle would never be published on this run.
            channel="dev"
            name="HomeskzIfcImportDev"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
            # main (and any manual/scheduled re-dispatch) publishes the stable
            # release, so build only the stable channel.
            channel="stable"
            name="HomeskzIfcImport"
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
            echo "channel=$channel"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the resolved commit (PR head, or the pushed/ dispatched sha).
          ref: ${{ steps.ctx.outputs.sha }}

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      # Restore the previously trimmed SDK if we have it. Only the pieces a mac
      # plug-in build needs are kept (see scripts/fetch-vw-sdk.sh).
      - name: Restore Vectorworks SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      # Compiler-object cache, restored across runs. A rolling key (per-commit,
      # falling back to the newest "ccache-mac-" cache) means each run saves an
      # updated cache and starts from the most recent one, so only the TUs that
      # actually changed since then recompile.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mac-${{ github.sha }}
          restore-keys: |
            ccache-mac-

      # Download + trim on a cache miss, verify either way. The script decides
      # which it is by looking at $VW_SDK_DIR, so there is no cache-hit condition
      # here; it is shared with the other three SDK jobs (see its header).
      - name: Set up Vectorworks SDK
        run: scripts/fetch-vw-sdk.sh

      - name: Install ccache
        run: brew install ccache

      - name: Configure
        env:
          VW_BUILD_VERSION: ${{ steps.ctx.outputs.short }}
          VW_BUILD_BRANCH: ${{ steps.ctx.outputs.ref }}
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VW_BUILD_VERSION" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        # Builds only the channel this run publishes (VW_BUILD_CHANNEL), compiling
        # its TUs in parallel across all cores. ccache stats are reset before and
        # printed after so the cache hit rate is visible in the log.
        run: |
          set -euo pipefail
          ccache -z >/dev/null
          cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)" -v
          ccache -s

      # Apple Silicon requires every Mach-O to carry a code signature. We use a
      # free, certificate-less "ad-hoc" signature ("-"), which is enough for the
      # kernel to load the plug-in. This is NOT Apple Developer ID signing or
      # Vectorworks credentials; the plug-in is still "unsigned" in that sense and
      # will show the usual unknown-plug-in warning. Done after the build so the
      # signature seals the packaged .vwr resource too.
      - name: Ad-hoc code-sign the bundle
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          bundle="build/$NAME.vwlibrary"
          codesign --force --deep --sign - "$bundle"
          echo "Verifying signature for $NAME:"
          codesign --verify --strict --verbose=2 "$bundle"

      - name: Inspect built plug-in
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          bundle="build/$NAME.vwlibrary"
          test -d "$bundle" || { echo "::error::$bundle was not produced"; exit 1; }
          echo "== $NAME =="
          find "$bundle" -maxdepth 3
          lipo -info "$bundle/Contents/MacOS/$NAME"
          test -e "$bundle/Contents/Resources/$NAME.vwr" \
            || { echo "::error::$NAME.vwr was not packaged into the bundle"; exit 1; }
          echo "Build stamp:"
          /usr/libexec/PlistBuddy -c "Print :VWBuildChannel" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :VWBuildBranch"  "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :VWBuildCommit"  "$bundle/Contents/Info.plist"

      # Zip each signed bundle keeping the "<name>.vwlibrary/" wrapper folder, so
      # the zip expands to a usable bundle (not a bare "Contents" folder). These
      # zips are both the CI artifacts and the release assets the updater fetches.
      - name: Package bundle
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          rm -rf dist stage
          mkdir -p dist
          rm -rf "stage/$NAME"
          mkdir -p "stage/$NAME"
          cp -R "build/$NAME.vwlibrary" "stage/$NAME/"
          ( cd "stage/$NAME" && zip -qry "$GITHUB_WORKSPACE/dist/$NAME.vwlibrary.zip" "$NAME.vwlibrary" )
          ls -l dist

      - name: Upload plug-in artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vwlibrary-zips
          path: dist

  # ---------------------------------------------------------------------------
  # Windows build. Produces the ".vlb" module (a DLL) plus its sibling ".vwr"
  # resource, the "<name>.commit" build stamp and the PowerShell updater, zipped
  # per plug-in. Runs in PARALLEL with the macOS build and with both
  # static-analysis jobs, so nothing here waits on anything else. Publishing the
  # releases is deferred to the separate "release" job, which runs once all four
  # have finished — this job just produces and uploads its artifacts.
  build-windows:
    runs-on: windows-latest

    env:
      # URL of the Vectorworks 2026 win SDK (mirrors the mac SDK URL naming).
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-win-SDK.zip
      # Where the trimmed SDK lives after the first download (this is what gets
      # cached, so the large zip is never downloaded more than once).
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-win
      # Bump the "v" suffix to force a fresh SDK download.
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-win-v1

    steps:
      # Same commit/ref resolution as the macOS job (PR head, or pushed sha).
      - name: Resolve build context
        id: ctx
        shell: bash
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
            # A pull request publishes the dev prerelease, so build ONLY the dev
            # channel — the stable bundle would never be published on this run.
            channel="dev"
            name="HomeskzIfcImportDev"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
            # main (and any manual/scheduled re-dispatch) publishes the stable
            # release, so build only the stable channel.
            channel="stable"
            name="HomeskzIfcImport"
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
            echo "channel=$channel"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      # Restore the previously trimmed SDK if we have it. Only the pieces needed
      # to build a Windows plug-in are kept, so the cache is small.
      - name: Restore Vectorworks SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      # Download + trim on a cache miss, verify either way — the same script the
      # macOS job uses (it picks LibWin / ToolsWin from RUNNER_OS).
      - name: Set up Vectorworks SDK
        shell: bash
        run: scripts/fetch-vw-sdk.sh

      - name: Configure
        shell: bash
        env:
          VW_BUILD_VERSION: ${{ steps.ctx.outputs.short }}
          VW_BUILD_BRANCH: ${{ steps.ctx.outputs.ref }}
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
        run: |
          cmake -S . -B build -A x64 \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VW_BUILD_VERSION" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL"

      - name: Build
        # Builds only the channel this run publishes (VW_BUILD_CHANNEL). --parallel
        # runs MSBuild across cores (targets) and /MP (set in CMakeLists.txt)
        # parallelises the TUs within the target.
        #
        # No vcvars / msvc-dev-cmd step is needed: `cmake --build` drives MSBuild
        # through the Visual Studio generator, which brings its own toolset
        # environment. (Neither does tidy-windows — clang-cl finds MSVC by itself.)
        shell: bash
        run: cmake --build build --config Release --parallel "$(nproc)" -v

      - name: Inspect built plug-in
        shell: bash
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          d="build/Release"
          echo "== $NAME =="
          test -f "$d/$NAME.vlb" || { echo "::error::$NAME.vlb was not produced"; exit 1; }
          test -f "$d/$NAME.vwr" || { echo "::error::$NAME.vwr was not packaged"; exit 1; }
          test -f "$d/$NAME.commit" || { echo "::error::$NAME.commit build stamp missing"; exit 1; }
          echo "Build stamp: $(cat "$d/$NAME.commit")"

      # Zip each plug-in's flat files (module + resource + build stamp + updater)
      # into "<name>.vlb.zip". These are both the CI artifacts and the release
      # assets the Windows updater (vw-update.ps1) fetches.
      - name: Package module
        shell: pwsh
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = $env:NAME
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $files = @(
            "build/Release/$name.vlb",
            "build/Release/$name.vwr",
            "build/Release/$name.commit",
            "build/Release/vw-update.ps1"
          ) | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath "dist/$name.vlb.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload plug-in artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vlb-zips
          path: dist

  # ---------------------------------------------------------------------------
  # Static analysis of the SDK-DEPENDENT plug-in sources, one job per platform.
  #
  # WHY THESE ARE THEIR OWN JOBS. The SDK-free lint workflow (lint.yml) tidies the
  # 2-phase import code on a free Linux runner; these jobs extend the SAME
  # .clang-tidy rules to the code that only compiles against the Vectorworks SDK
  # (src/draw/ + ModuleMain / ExtMenu / Updater). clang-tidy cannot use a PCH (it
  # analyses without running the build), so every translation unit re-parses the
  # whole SDK umbrella header and the analysis costs minutes — far more than the
  # build it used to sit inside. Run as separate jobs it happens CONCURRENTLY with
  # the builds instead of after them, which takes it off the critical path.
  #
  # The gate is unchanged: `release` needs these jobs too, so a clang-tidy finding
  # still stops the release from being published even though the build succeeded.
  #
  # macOS covers the GS_MAC branches and Windows the GS_WIN ones (Widen / Narrow /
  # OwnModulePath / RunBundledScript in Updater.cpp), so together they tidy every
  # line. The translation units and the parallel execution live in
  # scripts/clang-tidy-sdk.sh — one definition for both jobs.
  #
  # Neither job builds anything, so it needs no build stamp and no ccache; the
  # SDK cache is restore-ONLY so these jobs never race the build jobs to save it.
  #
  # The compile database is generated for the ONE channel this run publishes (dev
  # on a pull request, stable on main). At the "both" default the database holds
  # two entries per source and clang-tidy analyses every file twice; the only
  # per-channel difference is the VW_DEV_BUILD define (3 branches in ModuleMain /
  # ExtMenu), and the pipeline covers both — PRs analyse dev, main analyses stable.
  # That is the whole context these jobs need, so they derive it inline instead of
  # repeating the build jobs' full "Resolve build context" step.
  tidy-mac:
    runs-on: macos-15

    # Split the translation units across runners. Within one runner clang-tidy is
    # already run core-count-wide, but that tops out with the core count (a 4-core
    # Windows runner only gets ~2.5x out of 4-way parallelism), and the analysis
    # is what this workflow's critical path is made of. Splitting is the only way
    # past that ceiling, and unlike most CI tuning it needs no careful measurement
    # to believe: half the translation units take about half as long on the same
    # host. scripts/clang-tidy-sdk.sh does the splitting (-s I/N), round-robin, so
    # the shards together are exactly the whole set — no gaps, no overlap.
    #
    # fail-fast is off so a finding in one shard does not cancel the other: both
    # should report, or you fix one diagnostic only to be shown the next one on
    # the following run. Adding shards is a one-token edit to the list below —
    # strategy.job-total feeds the count straight through to the script.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-mac-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-mac-v3
      # PR は dev、それ以外（main への push / 再ディスパッチ）は stable。
      VW_BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'dev' || 'stable' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Analyse the same commit the build jobs build (the PR head, not the
          # ephemeral merge commit).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The compile database records this toolchain's flags, so pin the same Xcode
      # the build job uses.
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      - name: Restore Vectorworks SDK cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      - name: Set up Vectorworks SDK
        run: scripts/fetch-vw-sdk.sh

      # clang-tidy is pinned to 18 (Homebrew, preinstalled on the runner image) to
      # match what .clang-tidy was tuned against.
      - name: Install clang-tidy
        run: brew install llvm@18

      # PCH off: clang-tidy never runs the build, so a database carrying
      # "-include-pch <missing>.pch" would make every file error out.
      - name: Configure compile database (no build)
        run: |
          cmake -S . -B build-tidy \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_ENABLE_PCH=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Static analysis (clang-tidy, SDK-dependent code)
        run: |
          scripts/clang-tidy-sdk.sh \
            -p build-tidy \
            -t "$(brew --prefix llvm@18)/bin/clang-tidy" \
            -s "${{ matrix.shard }}/${{ strategy.job-total }}"

  tidy-windows:
    runs-on: windows-latest

    # Sharded across runners for the same reason as tidy-mac (see there). This is
    # the workflow's critical path, so it is the shard that actually matters.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-win-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-win
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-win-v1
      VW_BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'dev' || 'stable' }}
      # The LLVM preinstalled on the runner image, named once. Every clang tool
      # this job runs (clang-cl for the compile database, clang-tidy for the
      # analysis) comes from here, so the version checked below is the version
      # actually used — see the check step for why that matters.
      LLVM_BIN: /c/Program Files/LLVM/bin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore Vectorworks SDK cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      - name: Set up Vectorworks SDK
        shell: bash
        run: scripts/fetch-vw-sdk.sh

      # ---------------------------------------------------------------------
      # NB for anyone tuning this job: the clang-tidy step's wall time swings by
      # ~1.4x between runners for identical work (the same single translation
      # unit measured 25 s on one host and 37 s on another). Do NOT conclude
      # anything from comparing that step across two runs — this job's setup was
      # once "fixed" and then "un-fixed" on exactly that mistake. Measure A and B
      # in the SAME job, interleaved, with a repeat of A at the end as a drift
      # control.
      # ---------------------------------------------------------------------

      # LLVM and Ninja both ship PREINSTALLED on the windows-latest image, so this
      # job installs neither — it only checks that what is there is usable. We used
      # to `choco install llvm ninja` here on the assumption that it was "a fast
      # no-op refresh"; measured, it cost 11-31 s per run for nothing.
      #
      # There is no vcvars / msvc-dev-cmd step either (it used to cost 12-17 s):
      # clang-cl locates the MSVC toolchain and the Windows SDK on its own
      # (registry / vswhere), so INCLUDE and LIB do not have to be injected into
      # the environment. Measured at this job's real concurrency — 15 TUs, 4-wide,
      # one host, run without / with / without — that made no difference:
      # 3:58 / 3:37 / 3:39, i.e. the drift control lands on the "with" figure and
      # the first run is just the tail of cache warm-up. The compile database is
      # byte-identical either way (same flags, same clang-cl), which is the reason
      # to expect exactly that.
      #
      # The one thing the install was really buying is a NEW ENOUGH clang: the
      # runner's MSVC standard-library headers static_assert "expected Clang 20 or
      # newer" and use Clang-20 builtins, so clang-cl / clang-tidy must be able to
      # parse them. (macOS pins llvm@18 because AppleClang + libc++ there impose no
      # such requirement.) Assert that here instead — free, and it fails with a
      # sentence you can act on rather than a wall of parse errors if a future
      # runner image ever ships an older LLVM than its own MSVC needs.
      - name: Check the preinstalled LLVM + Ninja
        shell: bash
        run: |
          set -euo pipefail
          "$LLVM_BIN/clang-tidy" --version
          ninja --version
          major="$("$LLVM_BIN/clang-tidy" --version |
            sed -n 's/.*LLVM version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "$major" ]; then
            echo "::error::Could not parse the LLVM version out of clang-tidy --version."
            exit 1
          fi
          if [ "$major" -lt 20 ]; then
            echo "::error::The runner ships LLVM $major, but its MSVC headers need Clang 20 or newer. Install a newer LLVM in this step (e.g. choco install llvm)."
            exit 1
          fi
          echo "LLVM $major is new enough."

      # The Visual Studio generator the real build uses does NOT emit a
      # compile_commands.json, so the database comes from a build-free configure
      # with Ninja + clang-cl. clang-cl inherits the same Windows (non-APPLE)
      # settings from CMakeLists.txt (_WINDOWS, /MD, the OnlyWin include dir), so
      # the database matches the real MSVC build's GS_WIN configuration. Nothing is
      # built here, so the link-only SDK libraries are never needed.
      #
      # The compiler is given as an ABSOLUTE PATH rather than "clang-cl": the
      # runner's PATH also carries Visual Studio's own bundled LLVM
      # (VC\Tools\Llvm\x64\bin), and which one a bare name resolves to is not
      # something this job should leave to chance — $LLVM_BIN is the one whose
      # version the step above checked, and the one clang-tidy runs from below.
      # (Today a bare name happens to resolve to the same binary; this just stops
      # that from being luck.)
      #
      # Only CMAKE_CXX_COMPILER is set. The project is declared LANGUAGES CXX, so
      # no C compiler is ever looked for; CMake reported the CMAKE_C_COMPILER that
      # used to be passed here as an unused variable.
      - name: Configure compile database (Ninja + clang-cl, no build)
        shell: bash
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_CXX_COMPILER="$LLVM_BIN/clang-cl.exe" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_ENABLE_PCH=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # clang-tidy forces -fno-delayed-template-parsing to get a full AST, but the
      # Vectorworks SDK's MSVC-oriented template headers (e.g. VWVariant.h calling
      # ::GS_NewPtr) rely on MSVC's delayed parsing to compile. Re-add
      # -fdelayed-template-parsing so those SDK templates parse as they do in the
      # real MSVC build; our own (non-template) code is still analyzed. Clang 20
      # deprecates -fdelayed-template-parsing under C++20 and, with
      # warnings-as-errors, that deprecation notice alone would fail the run. The
      # flag is still needed (see above) and functional, so silence just its
      # deprecation warning; everything else stays an error.
      - name: Static analysis (clang-tidy, SDK-dependent code)
        shell: bash
        run: |
          scripts/clang-tidy-sdk.sh \
            -p build-tidy \
            -t "$LLVM_BIN/clang-tidy" \
            -s "${{ matrix.shard }}/${{ strategy.job-total }}" \
            -x --extra-arg=-fdelayed-template-parsing \
            -x --extra-arg=-Wno-delayed-template-parsing-in-cxx20

  # ---------------------------------------------------------------------------
  # Publish the downloadable release. Runs only after BOTH platform builds AND
  # both static-analysis jobs have finished
  # (needs: [build-mac, build-windows, tidy-mac, tidy-windows]) so a single
  # release carries the macOS (.vwlibrary.zip) and Windows (.vlb.zip) assets
  # together — and so a clang-tidy finding still blocks publishing even though
  # the builds themselves succeeded. The analysis runs CONCURRENTLY with the
  # builds rather than inside them, so keeping it as a gate costs no extra time. Splitting this
  # out of the build jobs means neither platform publishes on its own, so there
  # is no create/attach race between them:
  #   main  -> refresh the rolling "stable" release with the HomeskzIfcImport bundle.
  #   other -> refresh a per-branch "dev-<branch>" prerelease with HomeskzIfcImportDev.
  # Rolling tags are deleted and recreated so they always point at this build.
  release:
    needs: [build-mac, build-windows, tidy-mac, tidy-windows]
    runs-on: ubuntu-latest

    # Only this job publishes/refreshes the GitHub Release that the local updater
    # scripts download from, so it is the only one that needs write access.
    permissions:
      contents: write

    steps:
      # Same commit/ref resolution as the build jobs (PR head, or pushed sha).
      # This job only publishes, so it needs the commit and the branch name — the
      # channel/bundle name the build jobs derive are not used here (the two
      # publish steps below name their assets explicitly), so they are not
      # computed.
      - name: Resolve build context
        id: ctx
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      # Pull both build jobs' zips into a single dist/ folder. The macOS job
      # uploaded the ".vwlibrary.zip" bundles; the Windows job the ".vlb.zip"
      # modules. After both downloads dist/ holds all four assets.
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vwlibrary-zips
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vlb-zips
          path: dist

      - name: List downloaded assets
        run: ls -l dist

      - name: Publish stable release (main)
        # Runs on a push to main, and on a manual/scheduled re-dispatch of this
        # workflow on main (the health-check workflow uses that to republish a
        # stable release that was missed — see stable-release-healthcheck.yml).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
          SHORT: ${{ steps.ctx.outputs.short }}
        run: |
          set -euo pipefail
          short="$SHORT"
          cat > notes.txt <<EOF
          channel=stable
          branch=main
          commit=${BUILD_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          # Delete + recreate as one unit, attaching both platform assets at once.
          # A missed stable release can go unnoticed, so retry with a long backoff
          # to ride out an extended GitHub API outage. If every attempt still
          # fails, the scheduled stable-release-healthcheck.yml notices the drift
          # and re-dispatches this build to republish.
          publish() {
            gh release delete stable --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create stable \
              "dist/HomeskzIfcImport.vwlibrary.zip" \
              "dist/HomeskzIfcImport.vlb.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "Stable (${short})" \
              --notes-file notes.txt \
              --latest
          }
          if publish; then exit 0; fi
          attempts=1
          for delay in 30 60 120 300 600; do
            echo "publish attempt $attempts failed; retrying in ${delay}s..."
            sleep "$delay"
            attempts=$((attempts + 1))
            if publish; then exit 0; fi
          done
          echo "::error::Failed to publish the stable release after $attempts attempts."
          exit 1

      - name: Publish dev prerelease (pull requests)
        # Feature branches are built via their pull request. Skip PRs from forks:
        # their GITHUB_TOKEN is read-only and cannot publish a release.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
          SHORT: ${{ steps.ctx.outputs.short }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
        run: |
          set -euo pipefail
          short="$SHORT"
          branch="$BRANCH"
          # Sanitize the branch name into a tag-safe slug.
          slug="$(printf '%s' "$branch" | tr '/:@ ' '----' | tr -c 'A-Za-z0-9._-' '-')"
          tag="dev-${slug}"
          cat > notes.txt <<EOF
          channel=dev
          branch=${branch}
          commit=${BUILD_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          # Guard against a delete/publish race. The branch may have been
          # deleted after the PR was opened but before this (slow) build
          # finished. If so, cleanup-dev-release.yml has already run and found
          # no prerelease to delete (this job had not published one yet), so
          # creating one now would orphan it forever. Skip publishing when the
          # branch no longer exists.
          branch_exists() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1
          }
          if ! branch_exists; then
            echo "Branch '$branch' no longer exists; skipping dev prerelease publish to avoid orphaning it."
            exit 0
          fi
          # Dev builds are only used while actively working on a branch, so no
          # retry: if a transient GitHub API error fails this, just re-run the
          # job manually. (The stable release, which could go unnoticed, does
          # retry and has a scheduled health check.)
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" \
            "dist/HomeskzIfcImportDev.vwlibrary.zip" \
            "dist/HomeskzIfcImportDev.vlb.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "Dev: ${branch} (${short})" \
            --notes-file notes.txt \
            --prerelease
          # Close the narrow window where the branch is deleted between the
          # check above and now: if cleanup ran during publish, it may have
          # missed the release. Re-check and clean up our own release if so.
          if ! branch_exists; then
            echo "Branch '$branch' was deleted during publish; removing the prerelease just created."
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          fi
