name: Build plug-in

on:
  # Only main builds on push — it is the protected default branch. Feature work
  # always lives in a pull request, which is what builds those branches (and
  # publishes their dev build). This keeps a branch-with-an-open-PR from
  # building twice (once for the push, once for the PR).
  push:
    branches: [main]
  pull_request:
  # このワークフローだけは workflow_dispatch を残す。stable の公開の取りこぼしを
  # 検知した stable-release-healthcheck.yml が `gh workflow run build.yml --ref main`
  # で再ディスパッチして stable を再公開するため、リリース経路に必要な入口である
  # （lint / test / codeql の手動ディスパッチは誰も使っておらず、単なる「再実行」なら
  # Actions 画面の Re-run で足りるので削除した）。手で調査を回したいときは
  # ci-debug.yml を使う。
  workflow_dispatch:

# Least privilege by default: the build jobs only check out the code and upload
# artifacts, so they get read-only access. The one job that needs to write
# (refreshing the GitHub Release) requests contents: write on itself instead. The
# R2 upload does not use the GitHub token at all — it authenticates with its own
# credentials, so no job needs write access to publish the actual build.
permissions:
  contents: read

# One build per ref. On a pull request a new push cancels the in-flight build
# for that PR: only the latest commit's dev build matters, so racing an
# outdated build to completion just wastes runner time. Publishing is per-branch
# and idempotent on both sides (the "dev/<slug>/" prefix in R2 and the
# "dev-<branch>" release are each rewritten wholesale), so a cancel mid-publish is
# harmless — the newer run that triggered the cancellation republishes for its
# (newer) commit, and state converges to the latest push.
#
# On main we deliberately do NOT cancel (cancel-in-progress is false for push /
# workflow_dispatch): every commit to main publishes its own stable build, so
# each build must run to completion and none may be superseded. The group is
# per-ref (refs/pull/<n>/merge is unique per PR, refs/heads/main for main), so
# one branch's build never cancels another's.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mac:
    # Apple Silicon runner (macos-14 and macos-15 are arm64).
    runs-on: macos-15

    env:
      # URL of the Vectorworks 2026 mac SDK (~800 MB download).
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-mac-SDK.zip
      # Where the trimmed SDK lives after the first download. This directory is
      # what gets cached, so we never download the 800 MB zip more than once.
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk
      # Bump the "v" suffix to force a fresh SDK download (e.g. after Vectorworks
      # publishes a new "latest" SDK).
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-mac-v3
      # ccache speeds up repeat builds: unchanged translation units are served
      # from the object cache instead of recompiled (the SDK-heavy TUs behind the
      # PCH dominate the build). The dir is cached across runs. pch_defines +
      # time_macros let ccache cache PCH-using compilations correctly.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      # Resolve the commit/ref we are really building. For a pull_request event
      # GITHUB_SHA is an ephemeral merge commit and GITHUB_REF_NAME is
      # "<n>/merge", so use the PR head instead — that is the commit the
      # developer pushed and the one the dev prerelease should point at.
      - name: Resolve build context
        id: ctx
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
          # Whether this run will publish. A pull request from a FORK cannot
          # (its token is read-only and the R2 secrets are withheld), so such a
          # run is a build-only check.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
            # A pull request publishes the dev prerelease, so build ONLY the dev
            # channel — the stable bundle would never be published on this run.
            channel="dev"
            name="HomeskzIfcImportDev"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
            # main (and any manual/scheduled re-dispatch) publishes the stable
            # release, so build only the stable channel.
            channel="stable"
            name="HomeskzIfcImport"
          fi
          publish=true
          [ "$IS_FORK_PR" = "true" ] && publish=false
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
            echo "channel=$channel"
            echo "name=$name"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the resolved commit (PR head, or the pushed/ dispatched sha).
          ref: ${{ steps.ctx.outputs.sha }}

      # The bundled updater scripts have no distribution URL hardcoded in the
      # repository — CMake bakes vars.VW_R2_PUBLIC_BASE into the copy it ships
      # inside the plug-in (see VW_UPDATE_BASE_URL in CMakeLists.txt). A build
      # that WILL be published with an empty base URL would ship a plug-in that
      # can never update itself, so fail here rather than publish that. Fork PRs
      # publish nothing, so they are allowed to build without it.
      - name: Verify the distribution base URL is configured
        if: steps.ctx.outputs.publish == 'true'
        env:
          VW_R2_PUBLIC_BASE: ${{ vars.VW_R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          if [ -z "$VW_R2_PUBLIC_BASE" ]; then
            echo "::error::Repository variable VW_R2_PUBLIC_BASE is not set. Set it to the public base URL of the Cloudflare R2 bucket (e.g. https://dist.example.com) under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Distribution base URL: $VW_R2_PUBLIC_BASE"

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      # Restore the previously trimmed SDK if we have it. Only SDKLib/Include and
      # SDKLib/LibMac are kept, so the cache is a few tens of MB rather than 800.
      - name: Restore Vectorworks SDK cache
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      # Compiler-object cache, restored across runs. A rolling key (per-commit,
      # falling back to the newest "ccache-mac-" cache) means each run saves an
      # updated cache and starts from the most recent one, so only the TUs that
      # actually changed since then recompile.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mac-${{ github.sha }}
          restore-keys: |
            ccache-mac-

      - name: Download and trim Vectorworks SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          echo "Downloading SDK (this is large, ~800 MB)..."
          curl -fL --retry 4 --retry-delay 5 -o "$work/sdk.zip" "$VW_SDK_URL"

          echo "Extracting..."
          unzip -q "$work/sdk.zip" -d "$work/extracted"

          # The zip may wrap everything in a top-level folder, so locate SDKLib.
          # Skip the "__MACOSX" AppleDouble metadata mirror that macOS zips add.
          sdklib="$(find "$work/extracted" -type d -name SDKLib -not -path '*/__MACOSX/*' -print -quit)"
          if [ -z "$sdklib" ]; then
            echo "::error::Could not find SDKLib inside the downloaded SDK."
            exit 1
          fi
          echo "Found SDKLib at: $sdklib"

          # Keep only the pieces needed to build a mac plug-in:
          #  - Include: headers
          #  - LibMac:  libVWSDK.a and the VWMM framework
          #  - Source:  some Include/ headers #include ../../../Source/VWSDK/...
          #  - ToolsMac: the BuildVWR tool that packages the .vwr resource
          mkdir -p "$VW_SDK_DIR/SDKLib"
          cp -R "$sdklib/Include" "$VW_SDK_DIR/SDKLib/Include"
          cp -R "$sdklib/LibMac" "$VW_SDK_DIR/SDKLib/LibMac"
          cp -R "$sdklib/Source" "$VW_SDK_DIR/SDKLib/Source"
          cp -R "$sdklib/ToolsMac" "$VW_SDK_DIR/SDKLib/ToolsMac"

          # Make sure the BuildVWR tool is runnable (executable, not quarantined).
          chmod +x "$VW_SDK_DIR/SDKLib/ToolsMac/BuildVWR/BuildVWR" || true
          xattr -dr com.apple.quarantine "$VW_SDK_DIR/SDKLib/ToolsMac" 2>/dev/null || true

          rm -rf "$work"
          echo "Trimmed SDK size:"
          du -sh "$VW_SDK_DIR"

      - name: Verify SDK is present
        run: |
          set -euo pipefail
          test -f "$VW_SDK_DIR/SDKLib/Include/VectorworksSDK.h"
          test -f "$VW_SDK_DIR/SDKLib/LibMac/Release/libVWSDK.a"
          test -x "$VW_SDK_DIR/SDKLib/ToolsMac/BuildVWR/BuildVWR"
          echo "SDK looks good."

      - name: Install ccache
        run: brew install ccache

      - name: Configure
        env:
          VW_BUILD_VERSION: ${{ steps.ctx.outputs.short }}
          VW_BUILD_BRANCH: ${{ steps.ctx.outputs.ref }}
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
          VW_R2_PUBLIC_BASE: ${{ vars.VW_R2_PUBLIC_BASE }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VW_BUILD_VERSION" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_UPDATE_BASE_URL="$VW_R2_PUBLIC_BASE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Static analysis of the SDK-DEPENDENT plug-in sources, right before the
      # build. The SDK-free lint workflow (lint.yml) already tidies the updater
      # logic on a plain Linux runner; this step extends the SAME .clang-tidy
      # rules to the code that only compiles against the Vectorworks SDK
      # (ModuleMain / ExtMenu / Updater). Configuring with
      # CMAKE_EXPORT_COMPILE_COMMANDS above gives clang-tidy the exact compile
      # flags for each file. This job compiles the GS_MAC branches; the Windows
      # job runs the same check for the GS_WIN branches, so together they cover
      # every line. clang-tidy is pinned to 18 (Homebrew) to match .clang-tidy.
      #
      # Only SDK-DEPENDENT files belong here. src/UpdaterFlow.cpp includes no
      # Vectorworks header and has no GS_MAC / GS_WIN branch, so lint.yml already
      # tidies it under the same rules on a free Linux runner — re-tidying it
      # inside both (expensive) SDK jobs found nothing the Linux job would miss.
      #
      # src/draw/ is globbed rather than listed: every module there is SDK-bound
      # by definition (CLAUDE.md「依存の向きは厳守する」), so a new draw module is
      # tidied the moment it lands. The three named files are the rest of the
      # SDK-only surface, which does not grow per milestone. NB: `mapfile` is
      # bash 4+, and macOS ships bash 3.2 — hence plain glob expansion.
      #
      # The compile database is built for ONE channel (VW_BUILD_CHANNEL — dev on a
      # pull request, stable on main), matching what this run actually builds and
      # publishes. Leaving it at the "both" default put two entries per source in
      # the database and clang-tidy analysed every file TWICE, doubling a step that
      # already takes ~9 minutes. The only per-channel difference is the
      # VW_DEV_BUILD define (3 branches in ModuleMain / ExtMenu), and the two
      # channels are covered across the pipeline: PRs analyse the dev branches,
      # main analyses the stable ones.
      - name: Static analysis (clang-tidy, SDK-dependent code)
        env:
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
        run: |
          set -euo pipefail
          brew install llvm@18
          tidy="$(brew --prefix llvm@18)/bin/clang-tidy"
          "$tidy" --version
          # clang-tidy analyses the sources without running the build, so the PCH
          # (used by ./build) is never produced. Generate a separate, PCH-free
          # compile database purely for clang-tidy; the real build keeps the PCH.
          cmake -S . -B build-tidy \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_ENABLE_PCH=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          files=(src/draw/*.cpp src/ModuleMain.cpp src/Extensions/ExtMenu.cpp src/Updater.cpp)
          echo "Tidying ${#files[@]} SDK-dependent translation units:"
          printf '  %s\n' "${files[@]}"
          "$tidy" -p build-tidy --warnings-as-errors='*' "${files[@]}"

      - name: Build
        # Builds only the channel this run publishes (VW_BUILD_CHANNEL), compiling
        # its TUs in parallel across all cores. ccache stats are reset before and
        # printed after so the cache hit rate is visible in the log.
        run: |
          set -euo pipefail
          ccache -z >/dev/null
          cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)" -v
          ccache -s

      # Apple Silicon requires every Mach-O to carry a code signature. We use a
      # free, certificate-less "ad-hoc" signature ("-"), which is enough for the
      # kernel to load the plug-in. This is NOT Apple Developer ID signing or
      # Vectorworks credentials; the plug-in is still "unsigned" in that sense and
      # will show the usual unknown-plug-in warning. Done after the build so the
      # signature seals the packaged .vwr resource too.
      - name: Ad-hoc code-sign the bundle
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          bundle="build/$NAME.vwlibrary"
          codesign --force --deep --sign - "$bundle"
          echo "Verifying signature for $NAME:"
          codesign --verify --strict --verbose=2 "$bundle"

      - name: Inspect built plug-in
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          bundle="build/$NAME.vwlibrary"
          test -d "$bundle" || { echo "::error::$bundle was not produced"; exit 1; }
          echo "== $NAME =="
          find "$bundle" -maxdepth 3
          lipo -info "$bundle/Contents/MacOS/$NAME"
          test -e "$bundle/Contents/Resources/$NAME.vwr" \
            || { echo "::error::$NAME.vwr was not packaged into the bundle"; exit 1; }
          echo "Build stamp:"
          /usr/libexec/PlistBuddy -c "Print :VWBuildChannel" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :VWBuildBranch"  "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :VWBuildCommit"  "$bundle/Contents/Info.plist"

      # Zip each signed bundle keeping the "<name>.vwlibrary/" wrapper folder, so
      # the zip expands to a usable bundle (not a bare "Contents" folder). These
      # zips are both the CI artifacts and the objects uploaded to R2, which is
      # where the updater downloads them from.
      - name: Package bundle
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          rm -rf dist stage
          mkdir -p dist
          rm -rf "stage/$NAME"
          mkdir -p "stage/$NAME"
          cp -R "build/$NAME.vwlibrary" "stage/$NAME/"
          ( cd "stage/$NAME" && zip -qry "$GITHUB_WORKSPACE/dist/$NAME.vwlibrary.zip" "$NAME.vwlibrary" )
          ls -l dist

      - name: Upload plug-in artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vwlibrary-zips
          path: dist

  # ---------------------------------------------------------------------------
  # Windows build. Produces the ".vlb" module (a DLL) plus its sibling ".vwr"
  # resource, the "<name>.commit" build stamp and the PowerShell updater, zipped
  # per plug-in. Runs in PARALLEL with the macOS job (build-mac) so the two
  # platforms build concurrently instead of one after the other. Publishing the
  # releases is deferred to the separate "release" job, which runs once both
  # builds have finished — this job just produces and uploads its artifacts.
  build-windows:
    runs-on: windows-latest

    env:
      # URL of the Vectorworks 2026 win SDK (mirrors the mac SDK URL naming).
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-win-SDK.zip
      # Where the trimmed SDK lives after the first download (this is what gets
      # cached, so the large zip is never downloaded more than once).
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-win
      # Bump the "v" suffix to force a fresh SDK download.
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-win-v1

    steps:
      # Same commit/ref resolution as the macOS job (PR head, or pushed sha).
      - name: Resolve build context
        id: ctx
        shell: bash
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
            # A pull request publishes the dev prerelease, so build ONLY the dev
            # channel — the stable bundle would never be published on this run.
            channel="dev"
            name="HomeskzIfcImportDev"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
            # main (and any manual/scheduled re-dispatch) publishes the stable
            # release, so build only the stable channel.
            channel="stable"
            name="HomeskzIfcImport"
          fi
          publish=true
          [ "$IS_FORK_PR" = "true" ] && publish=false
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
            echo "channel=$channel"
            echo "name=$name"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      # Same guard as the macOS job: the updater URL is injected at build time
      # from vars.VW_R2_PUBLIC_BASE, never hardcoded in the repository.
      - name: Verify the distribution base URL is configured
        if: steps.ctx.outputs.publish == 'true'
        shell: bash
        env:
          VW_R2_PUBLIC_BASE: ${{ vars.VW_R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          if [ -z "$VW_R2_PUBLIC_BASE" ]; then
            echo "::error::Repository variable VW_R2_PUBLIC_BASE is not set. Set it to the public base URL of the Cloudflare R2 bucket (e.g. https://dist.example.com) under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Distribution base URL: $VW_R2_PUBLIC_BASE"

      # Restore the previously trimmed SDK if we have it. Only the pieces needed
      # to build a Windows plug-in are kept, so the cache is small.
      - name: Restore Vectorworks SDK cache
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      - name: Download and trim Vectorworks SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Silencing progress makes Invoke-* and curl far faster in CI.
          $ProgressPreference = 'SilentlyContinue'

          $work = Join-Path $env:RUNNER_TEMP 'vw-sdk-dl'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work 'sdk.zip'

          Write-Host 'Downloading SDK (this is large)...'
          curl.exe -fL --retry 4 --retry-delay 5 -o $zip $env:VW_SDK_URL
          if ($LASTEXITCODE -ne 0) { throw "SDK download failed ($LASTEXITCODE)" }

          Write-Host 'Extracting...'
          $ex = Join-Path $work 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $ex -Force

          $sdklib = Get-ChildItem -LiteralPath $ex -Recurse -Directory -Filter 'SDKLib' |
            Select-Object -First 1
          if (-not $sdklib) { Write-Error '::error::Could not find SDKLib inside the downloaded SDK.'; exit 1 }
          Write-Host "Found SDKLib at: $($sdklib.FullName)"

          # Keep only what a Windows plug-in build needs:
          #  - Include:  headers
          #  - LibWin:   VWSDK.lib and the VWMM import library
          #  - Source:   some Include/ headers #include ../../../Source/VWSDK/...
          #  - ToolsWin: buildvwr.exe + 7-Zip, which package the .vwr resource
          $dst = Join-Path $env:VW_SDK_DIR 'SDKLib'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          foreach ($sub in 'Include','LibWin','Source','ToolsWin') {
            $s = Join-Path $sdklib.FullName $sub
            if (Test-Path -LiteralPath $s) {
              Copy-Item -LiteralPath $s -Destination $dst -Recurse -Force
            } else {
              Write-Host "(note) SDKLib/$sub not present in this SDK; skipping."
            }
          }

          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Trimmed SDK contents:'
          Get-ChildItem -LiteralPath $dst | Select-Object Name

      - name: Verify SDK is present
        shell: bash
        run: |
          set -euo pipefail
          test -f "$VW_SDK_DIR/SDKLib/Include/VectorworksSDK.h"
          test -f "$VW_SDK_DIR/SDKLib/LibWin/Release/VWSDK.lib"
          test -f "$VW_SDK_DIR/SDKLib/ToolsWin/BuildVWR/buildvwr.exe"
          echo "SDK looks good."

      - name: Configure
        shell: bash
        env:
          VW_BUILD_VERSION: ${{ steps.ctx.outputs.short }}
          VW_BUILD_BRANCH: ${{ steps.ctx.outputs.ref }}
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
          VW_R2_PUBLIC_BASE: ${{ vars.VW_R2_PUBLIC_BASE }}
        run: |
          cmake -S . -B build -A x64 \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VW_BUILD_VERSION" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_UPDATE_BASE_URL="$VW_R2_PUBLIC_BASE"

      # Static analysis of the SDK-DEPENDENT plug-in sources, right before the
      # build — the Windows counterpart to the macOS clang-tidy step. It covers
      # the GS_WIN branches (Widen / Narrow / OwnModulePath / RunBundledScript in
      # Updater.cpp) that the macOS job preprocesses out, so the two jobs
      # together tidy every line.
      #
      # The Visual Studio generator used for the real build does NOT emit a
      # compile_commands.json, so a SEPARATE, build-free configure with Ninja +
      # clang-cl produces the compile database for clang-tidy. clang-cl inherits
      # the same Windows (non-APPLE) settings from CMakeLists.txt (_WINDOWS, /MD,
      # the OnlyWin include dir), so the database matches the real MSVC build's
      # GS_WIN configuration. Nothing is built here — only configured — so the
      # link-only SDK libraries are never needed.
      - name: Set up MSVC environment (for clang-cl)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install LLVM + Ninja (for clang-tidy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install --no-progress -y ninja
          # Install the LATEST LLVM rather than pinning a version: the runner's
          # MSVC standard-library headers static_assert "expected Clang 20 or
          # newer" and use Clang-20 builtins, so clang-cl / clang-tidy must be new
          # enough to parse them. (macOS pins llvm@18 because AppleClang + libc++
          # there impose no such requirement.) Bump the runner's MSVC and this
          # both track "latest", so they stay compatible. NB: LLVM ships
          # preinstalled on the runner image, so this is a fast no-op refresh (a
          # few seconds); we deliberately do NOT actions/cache "C:\Program
          # Files\LLVM" — caching a ~2-3 GB already-present tree saves nothing and
          # its restore/save dominates the whole job (~15 min).
          choco install --no-progress -y llvm
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # No build stamp is passed here (unlike the real Configure above, and like
      # the macOS clang-tidy configure): VW_BUILD_VERSION / VW_BUILD_BRANCH only
      # end up as string literals in the binary, and nothing is built from this
      # tree — it exists solely to emit compile_commands.json for clang-tidy.
      # VW_BUILD_CHANNEL, on the other hand, IS passed: it keeps the database to
      # the single channel this run builds, so clang-tidy analyses each source
      # once instead of twice (see the macOS job for the full rationale).
      - name: Configure compile database (Ninja + clang-cl, no build)
        shell: bash
        env:
          VW_BUILD_CHANNEL: ${{ steps.ctx.outputs.channel }}
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_CHANNEL="$VW_BUILD_CHANNEL" \
            -DVW_ENABLE_PCH=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Static analysis (clang-tidy, SDK-dependent code)
        shell: bash
        run: |
          set -euo pipefail
          tidy="/c/Program Files/LLVM/bin/clang-tidy"
          "$tidy" --version
          # clang-tidy forces -fno-delayed-template-parsing to get a full AST, but
          # the Vectorworks SDK's MSVC-oriented template headers (e.g. VWVariant.h
          # calling ::GS_NewPtr) rely on MSVC's delayed parsing to compile. Re-add
          # -fdelayed-template-parsing so those SDK templates parse as they do in
          # the real MSVC build; our own (non-template) code is still analyzed.
          # Clang 20 deprecates -fdelayed-template-parsing under C++20 and, with
          # warnings-as-errors, that deprecation notice alone would fail the run.
          # The flag is still needed (see above) and functional, so silence just
          # its deprecation warning; everything else stays an error.
          # Same globbed set as the macOS job (see the comment there); this run
          # covers the GS_WIN branches.
          files=(src/draw/*.cpp src/ModuleMain.cpp src/Extensions/ExtMenu.cpp src/Updater.cpp)
          echo "Tidying ${#files[@]} SDK-dependent translation units:"
          printf '  %s\n' "${files[@]}"
          "$tidy" -p build-tidy --warnings-as-errors='*' \
            --extra-arg=-fdelayed-template-parsing \
            --extra-arg=-Wno-delayed-template-parsing-in-cxx20 \
            "${files[@]}"

      - name: Build
        # Builds only the channel this run publishes (VW_BUILD_CHANNEL). --parallel
        # runs MSBuild across cores (targets) and /MP (set in CMakeLists.txt)
        # parallelises the TUs within the target.
        shell: bash
        run: cmake --build build --config Release --parallel "$(nproc)" -v

      - name: Inspect built plug-in
        shell: bash
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          set -euo pipefail
          d="build/Release"
          echo "== $NAME =="
          test -f "$d/$NAME.vlb" || { echo "::error::$NAME.vlb was not produced"; exit 1; }
          test -f "$d/$NAME.vwr" || { echo "::error::$NAME.vwr was not packaged"; exit 1; }
          test -f "$d/$NAME.commit" || { echo "::error::$NAME.commit build stamp missing"; exit 1; }
          echo "Build stamp: $(cat "$d/$NAME.commit")"

      # Zip each plug-in's flat files (module + resource + build stamp + updater)
      # into "<name>.vlb.zip". These are both the CI artifacts and the objects
      # uploaded to R2, which is where the Windows updater (vw-update.ps1)
      # downloads them from.
      - name: Package module
        shell: pwsh
        env:
          NAME: ${{ steps.ctx.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = $env:NAME
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $files = @(
            "build/Release/$name.vlb",
            "build/Release/$name.vwr",
            "build/Release/$name.commit",
            "build/Release/vw-update.ps1"
          ) | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath "dist/$name.vlb.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload plug-in artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vlb-zips
          path: dist

  # ---------------------------------------------------------------------------
  # Publish the downloadable build. Runs only after BOTH platform builds have
  # finished (needs: [build-mac, build-windows]) so one publish carries the macOS
  # (.vwlibrary.zip) and Windows (.vlb.zip) assets together. Splitting this out of
  # the build jobs means neither platform publishes on its own, so there is no
  # create/attach race between them:
  #   main  -> refresh the "stable" build (HomeskzIfcImport).
  #   other -> refresh the per-branch "dev-<branch>" build (HomeskzIfcImportDev).
  #
  # WHERE the assets go changed: they are uploaded to a Cloudflare R2 bucket, not
  # attached to the GitHub Release. Fetching release / prerelease assets from the
  # GitHub API turned out to be unreliable from the client side, so R2 + small
  # JSON manifests are now the distribution channel the updater reads
  # (scripts/r2-publish.sh documents the bucket layout and manifest schema). The
  # GitHub Release is still refreshed, but purely as the human-facing record: it
  # carries the R2 download links in its notes instead of the binaries.
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    # Only this job refreshes the GitHub Release, so it is the only one that
    # needs write access. The R2 upload authenticates with its own credentials.
    permissions:
      contents: write

    env:
      # Non-secret configuration (repository variables): which bucket, and the
      # public base URL the manifests' download links are built from — the same
      # value the build jobs bake into the shipped updater scripts.
      VW_R2_BUCKET: ${{ vars.VW_R2_BUCKET }}
      VW_R2_PUBLIC_BASE: ${{ vars.VW_R2_PUBLIC_BASE }}
      # Secrets: the account whose S3 endpoint we talk to, and an R2 API token
      # scoped to this bucket. Passed under the AWS_* names aws-cli expects.
      VW_R2_ACCOUNT_ID: ${{ secrets.VW_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VW_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VW_R2_SECRET_ACCESS_KEY }}

    steps:
      # Same commit/ref resolution as the build jobs (PR head, or pushed sha).
      # This job only publishes, so it needs the commit and the branch name — the
      # channel/bundle name the build jobs derive are not used here (the two
      # publish steps below name their assets explicitly), so they are not
      # computed.
      - name: Resolve build context
        id: ctx
        env:
          # head_ref is attacker-controllable (a branch name), so pass it through
          # the environment instead of interpolating it into the script directly.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            ref="$HEAD_REF"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref_name }}"
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      # The publisher (scripts/r2-publish.sh) lives in the repository, so this
      # job needs a checkout too. Only the scripts are used, so a shallow
      # checkout of the built commit is enough.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      # Pull both build jobs' zips into a single dist/ folder. The macOS job
      # uploaded the ".vwlibrary.zip" bundle; the Windows job the ".vlb.zip"
      # module. Each job builds only the channel this run publishes, so after
      # both downloads dist/ holds that channel's two assets — exactly the pair
      # scripts/r2-publish.sh expects.
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vwlibrary-zips
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vlb-zips
          path: dist

      - name: List downloaded assets
        run: ls -l dist

      # --- stable (main) -------------------------------------------------------
      # Upload the assets to R2 FIRST. This is the only step the updater depends
      # on, so it is the one that must succeed; scripts/r2-publish.sh retries each
      # upload, swaps the manifest in only after both zips are in place, and
      # prunes the previous build's zips. The step's outputs carry the public URLs
      # so the GitHub Release below can link to them.
      - name: Publish stable build to R2 (main)
        id: r2-stable
        # Runs on a push to main, and on a manual/scheduled re-dispatch of this
        # workflow on main (the health-check workflow uses that to republish a
        # stable build that was missed — see stable-release-healthcheck.yml).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
        run: scripts/r2-publish.sh publish-stable --commit "$BUILD_SHA" --branch main --dist dist

      - name: Refresh the stable GitHub Release (links to R2)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
          SHORT: ${{ steps.ctx.outputs.short }}
          MAC_URL: ${{ steps.r2-stable.outputs.mac_url }}
          WIN_URL: ${{ steps.r2-stable.outputs.win_url }}
          MANIFEST_URL: ${{ steps.r2-stable.outputs.manifest_url }}
        run: |
          set -euo pipefail
          # No assets are attached any more: the release is the human-facing
          # record and points at the R2 objects the updater actually downloads.
          # The machine-readable "key=value" header is kept so anything that used
          # to scrape the notes still finds commit/branch/channel.
          cat > notes.txt <<EOF
          channel=stable
          branch=main
          commit=${BUILD_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## ダウンロード

          - macOS: <${MAC_URL}>
          - Windows: <${WIN_URL}>

          マニフェスト: <${MANIFEST_URL}>

          配布実体は Cloudflare R2 にあります（このリリースにアセットは添付されません）。
          プラグインの自動アップデートは上記マニフェストを参照します。
          EOF
          # Delete + recreate as one unit. A missed stable release is only a
          # missing record now (R2 already has the build), but it is still worth
          # riding out a GitHub API blip, so keep a short retry.
          publish() {
            gh release delete stable --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create stable \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "Stable (${SHORT})" \
              --notes-file notes.txt \
              --latest
          }
          if publish; then exit 0; fi
          attempts=1
          for delay in 30 60 120; do
            echo "publish attempt $attempts failed; retrying in ${delay}s..."
            sleep "$delay"
            attempts=$((attempts + 1))
            if publish; then exit 0; fi
          done
          echo "::error::Failed to refresh the stable GitHub Release after $attempts attempts."
          exit 1

      # --- dev (pull requests) -------------------------------------------------
      # Guard against a delete/publish race. The branch may have been deleted
      # after the PR was opened but before this (slow) build finished. If so,
      # cleanup-dev-release.yml has already run and found nothing to delete (this
      # job had not published yet), so publishing now would orphan the build in
      # the bucket forever. Skip when the branch is gone, and re-check afterwards
      # to close the narrow window where it disappears mid-publish.
      - name: Check the branch still exists
        id: branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH' no longer exists; skipping the dev publish to avoid orphaning it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dev build to R2 (pull requests)
        id: r2-dev
        # Feature branches are built via their pull request. Skip PRs from forks:
        # they get neither the write token nor the R2 secrets.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.branch.outputs.exists == 'true'
        env:
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
        run: scripts/r2-publish.sh publish-dev --commit "$BUILD_SHA" --branch "$BRANCH" --dist dist

      - name: Refresh the dev prerelease (links to R2)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.ctx.outputs.sha }}
          SHORT: ${{ steps.ctx.outputs.short }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
          SLUG: ${{ steps.r2-dev.outputs.slug }}
          MAC_URL: ${{ steps.r2-dev.outputs.mac_url }}
          WIN_URL: ${{ steps.r2-dev.outputs.win_url }}
          MANIFEST_URL: ${{ steps.r2-dev.outputs.manifest_url }}
        run: |
          set -euo pipefail
          # The publisher derives the slug (bucket folder); reuse it as the tag
          # so the two never drift apart.
          tag="dev-${SLUG}"
          cat > notes.txt <<EOF
          channel=dev
          branch=${BRANCH}
          commit=${BUILD_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## ダウンロード

          - macOS: <${MAC_URL}>
          - Windows: <${WIN_URL}>

          マニフェスト: <${MANIFEST_URL}>

          配布実体は Cloudflare R2 にあります（このリリースにアセットは添付されません）。
          EOF
          # Dev builds are only used while actively working on a branch, so no
          # retry: if a transient GitHub API error fails this, just re-run the
          # job. (R2 — the part the updater reads — was already written above.)
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "Dev: ${BRANCH} (${SHORT})" \
            --notes-file notes.txt \
            --prerelease

      - name: Clean up if the branch was deleted mid-publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.ctx.outputs.ref }}
          SLUG: ${{ steps.r2-dev.outputs.slug }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            exit 0
          fi
          echo "Branch '$BRANCH' was deleted during publish; removing what this run just created."
          gh release delete "dev-${SLUG}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          scripts/r2-publish.sh remove-dev --branch "$BRANCH"
